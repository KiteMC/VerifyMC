name: Release VerifyMC

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version
        run: echo "VERSION=$(awk '/version:/ {print $2}' version.yml)" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/glassx/package-lock.json

      - name: Build GlassX theme
        working-directory: ./frontend/glassx
        run: |
          npm ci
          npm run build
          mkdir -p ../../dist/glassx
          cp -r dist/* ../../dist/glassx/

      - name: Copy themes to plugin resources
        run: |
          mkdir -p plugin/src/main/resources/static/glassx
          rm -rf plugin/src/main/resources/static/glassx/*
          cp -r dist/glassx/* plugin/src/main/resources/static/glassx/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build plugin jars
        run: |
          mvn -B -f plugin/pom.xml clean package -DskipTests
          mvn -B -f plugin-proxy/pom.xml clean package -DskipTests

      - name: Compose release notes
        run: |
          awk '/^release_notes: \|/{started=1; next} started {sub(/^  /, ""); print}' version.yml > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          generate_release_notes: false
          body_path: release_notes.md
          files: |
            plugin/target/verifymc-${{ env.VERSION }}.jar
            plugin-proxy/target/verifymc-proxy-${{ env.VERSION }}.jar
