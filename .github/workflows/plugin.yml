name: Build VerifyMC Plugin

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # ========== Initialization ==========
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version
        run: |
          echo "VERSION=$(awk '/version:/ {print $2}' version.yml)" >> $GITHUB_ENV

      # ========== Frontend Build ==========
      - name: Cache Node modules
        uses: actions/cache@v3
        with:
          path: frontend/glassx/node_modules
          key: node-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Build GlassX theme
        working-directory: ./frontend/glassx
        run: |
          npm ci
          npm run build
          mkdir -p ../../dist/glassx
          cp -r dist/* ../../dist/glassx/

      # ========== Backend Build ==========
      - name: Clean plugin target
        run: rm -rf plugin/target

      - name: Copy themes to plugin resources
        run: |
          mkdir -p plugin/src/main/resources/static/glassx
          rm -rf plugin/src/main/resources/static/glassx/*
          cp -r dist/glassx/* plugin/src/main/resources/static/glassx/

      - name: Clean all Maven targets
        run: find . -type d -name "target" | xargs rm -rf

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Check Java version
        run: java -version

      - name: Build plugin jar
        working-directory: ./plugin
        run: mvn clean package -U -DskipTests

      # ========== Proxy Plugin Build ==========
      - name: Build proxy plugin jar
        working-directory: ./plugin-proxy
        run: mvn clean package -U -DskipTests

      # ========== Artifact Processing ==========
      - name: Rename plugin jar
        run: |
          cd plugin/target
          for jar in *.jar; do
            if [[ "$jar" == *"original-"* ]] && [[ "$jar" != "original-verifymc-${{ env.VERSION }}.jar" ]]; then
              mv "$jar" "original-verifymc-${{ env.VERSION }}.jar"
            elif [[ "$jar" != "verifymc-${{ env.VERSION }}.jar" ]] && [[ "$jar" != "original-verifymc-${{ env.VERSION }}.jar" ]]; then
              mv "$jar" "verifymc-${{ env.VERSION }}.jar"
            fi
          done

      - name: Rename proxy plugin jar
        run: |
          cd plugin-proxy/target
          for jar in *.jar; do
            if [[ "$jar" == *"original-"* ]] && [[ "$jar" != "original-verifymc-proxy-${{ env.VERSION }}.jar" ]]; then
              mv "$jar" "original-verifymc-proxy-${{ env.VERSION }}.jar"
            elif [[ "$jar" != "verifymc-proxy-${{ env.VERSION }}.jar" ]] && [[ "$jar" != "original-verifymc-proxy-${{ env.VERSION }}.jar" ]]; then
              mv "$jar" "verifymc-proxy-${{ env.VERSION }}.jar"
            fi
          done

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: verifymc-plugin
          path: |
            plugin/target/verifymc-*.jar
            plugin/target/original-verifymc-*.jar

      - name: Upload proxy plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: verifymc-proxy-plugin
          path: plugin-proxy/target/verifymc-proxy-*.jar

      - name: List plugin/target contents on failure
        if: failure()
        run: |
          ls -lR plugin/target || true
          ls -lR plugin-proxy/target || true
