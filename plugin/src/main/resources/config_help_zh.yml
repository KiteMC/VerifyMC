# ----------------------------------------
# 全局设置
# ----------------------------------------
# 全局语言设置，影响插件消息和网页界面。(例如 'zh', 'en')
language: zh
# 开启后，控制台会输出详细的日志，用于故障排查。
debug: false

# ----------------------------------------
# 网页服务器
# ----------------------------------------
# 网页服务使用的端口。
web_port: 8080
# WebSocket 服务使用的端口。
ws_port: 8081
# 显示在网页界面上的服务器名称。
web_server_prefix: '[ Name ]'

# ----------------------------------------
# 验证与白名单
# ----------------------------------------
# 支持的验证方式。可选: 'email'（邮箱验证码）, 'captcha'（图形验证码）。
# 可以同时使用多种方式，例如: [email, captcha]
# 
# 【重要】仅配置下方的 captcha: 部分不会启用图形验证码！
# 要启用图形验证码，必须在此列表中添加 'captcha'：
#   仅使用图形验证码: auth_methods: [captcha]
#   同时使用邮箱和图形验证码: auth_methods: [email, captcha]
auth_methods:
  - email
# 单个邮箱最多可以绑定的游戏账号数量。
max_accounts_per_email: 2
# 白名单模式: 'bukkit' (与服务器的 whitelist.json 同步) 或 'plugin' (使用插件内部数据库)。
whitelist_mode: plugin
# 在 'plugin' 模式下，向未在白名单中的玩家显示的注册URL。
web_register_url: https://domain.com/

# ----------------------------------------
# 注册
# ----------------------------------------
# 如果为 true，新用户注册将自动通过。如果为 false，则需要管理员手动审核。
register:
  auto_approve: false

# ----------------------------------------
# 用户与安全
# ----------------------------------------
# 用于验证玩家名的正则表达式。
username_regex: "^[a-zA-Z0-9_-]{3,16}$"
# 如果为 false，则仅大小写不同的用户名（例如 "Player" 和 "player"）将被视为相同。
username_case_sensitive: false

# ----------------------------------------
# 用户通知
# ----------------------------------------
# 当管理员审核用户申请后，向用户发送邮件通知。
user_notification:
  # 是否启用用户通知功能
  enabled: true
  # 审核通过时是否发送通知邮件
  on_approve: true
  # 审核拒绝时是否发送通知邮件
  on_reject: true

# ----------------------------------------
# 前端 (UI)
# ----------------------------------------
frontend:
  # 网页界面的视觉主题。可选: 'glassx'。
  theme: glassx
  # Logo 的 URL。可以是网页链接或本地文件路径 (例如 '/logo.png')。
  logo_url: /logo.png
  # 显示在主页上的公告信息。
  announcement: 欢迎来到[ Name ]!

# ----------------------------------------
# 邮箱 (SMTP)
# ----------------------------------------
smtp:
  host: smtp.qq.com
  port: 587
  username: your_email@qq.com
  password: your_email_password
  from: your_email@qq.com
  enable_ssl: true
# 验证码邮件的主题（标题）
email_subject: VerifyMC Verification Code

# ----------------------------------------
# 自动更新资源
# ----------------------------------------
# 如果为 true，插件启动时会自动更新语言文件、邮件模板和主题文件。
auto_update_resources: true

# ----------------------------------------
# 邮箱注册限制
# ----------------------------------------
# 是否启用邮箱域名白名单
enable_email_domain_whitelist: true
# 是否限制邮箱别名（如禁止 user+xxx@gmail.com）
enable_email_alias_limit: false
# 邮箱域名白名单，留空则使用默认主流邮箱域
email_domain_whitelist:
  - gmail.com
  - 163.com
  - 126.com
  - qq.com
  - outlook.com
  - hotmail.com
  - icloud.com
  - yahoo.com
  - foxmail.com 

# ----------------------------------------
# 存储
# ----------------------------------------
# 存储类型，可选: file（本地文件）, mysql（外部数据库）
storage: file
mysql:
  host: localhost
  port: 3306
  database: verifymc
  user: root
  password: yourpassword 

# ----------------------------------------
# Authme集成配置
# ----------------------------------------
authme:
  # 是否启用Authme集成功能
  enabled: true
  # 是否强制在Web注册时要求输入密码
  require_password: true
  # 密码正则表达式
  password_regex: "^[a-zA-Z0-9_]{8,26}$"
  database:
    # database 模式下数据库类型: mysql / sqlite
    type: sqlite
    # AuthMe 表名
    table: authme
    # 密码格式仅支持 sha256，盐长度固定为 16。如原先不是，请在 AuthMe 中切换（ AuthMe 支持惰性回退）。
    # 在 Authme 中切换完之后请先直接上游戏登录一次使加密格式惰性回退成 sha265 或者也可以直接在后台重置密码。
    # VerifyMC 与 AuthMe 双向同步间隔（秒）
    sync_interval_seconds: 30
    mysql:
      host: 127.0.0.1
      port: 3306
      database: authme
      user: root
      password: yourpassword
    sqlite:
      path: plugins/AuthMe/authme.db
    columns:
      mySQLColumnId: id
      # 用于存储或查询玩家昵称的列
      mySQLColumnName: username
      # 用于存储或查询玩家真实名称（RealName）的列
      mySQLRealName: realname
      # 用于存储玩家密码的列
      mySQLColumnPassword: password
      # 用于存储玩家密码盐值的列
      mySQLColumnSalt: ''
      # 用于存储玩家邮箱的列
      mySQLColumnEmail: email
      # 用于存储玩家是否已登录状态的列
      mySQLColumnLogged: isLogged
      # 用于存储玩家是否拥有有效会话状态的列
      mySQLColumnHasSession: hasSession
      # 用于存储玩家最后登录 IP 的列
      mySQLColumnIp: ip
      # 用于存储玩家最后登录时间的列
      mySQLColumnLastLogin: lastlogin
      # 用于存储注册日期的列
      mySQLColumnRegisterDate: regdate
      # 用于存储注册时 IP 地址的列
      mySQLColumnRegisterIp: regip
      # 用于存储玩家最后位置 X 坐标的列
      mySQLlastlocX: x
      # 用于存储玩家最后位置 Y 坐标的列
      mySQLlastlocY: y
      # 用于存储玩家最后位置 Z 坐标的列
      mySQLlastlocZ: z
      # 用于存储玩家最后位置所在世界名称的列
      mySQLlastlocWorld: world
      # 用于存储玩家最后位置朝向 Yaw 的列
      mySQLlastlocYaw: yaw
      # 用于存储玩家最后位置俯仰 Pitch 的列
      mySQLlastlocPitch: pitch
      # 用于存储玩家 UUID（可选）的列
      mySQLPlayerUUID: ''

# ----------------------------------------
# 图形验证码配置
# ----------------------------------------
# 图形验证码可作为邮箱验证的替代或补充方案
# 在 auth_methods 中添加 'captcha' 来启用: auth_methods: [captcha]
# 或同时使用两种验证: auth_methods: [email, captcha]
captcha:
  # 验证码类型: math（数学表达式）或 text（随机字符）
  type: math
  # 文本验证码长度（math 类型时忽略此项）
  length: 4
  # 验证码过期时间（秒）
  expire_seconds: 300

# ----------------------------------------
# 基岩版玩家支持
# ----------------------------------------
# 适用于 Geyser/Floodgate 的基岩版玩家
bedrock:
  # 是否启用基岩版玩家支持
  enabled: false
  # 基岩版玩家用户名前缀（Floodgate 常用 "."）
  prefix: "."
  # 基岩版用户名正则表达式
  username_regex: "^[a-zA-Z0-9._-]{3,15}$"

# ----------------------------------------
# 问卷调查配置
# ----------------------------------------
# 详细问题配置请参见 questionnaire.yml
questionnaire:
  # 是否启用问卷功能
  enabled: false
  # 通过所需的最低分数
  pass_score: 60
  rate_limit:
    # 限流时间窗口（毫秒）
    window_ms: 300000
    ip:
      # 每个 IP 在时间窗口内允许的最大提交次数
      max: 20
    uuid:
      # 每个 Minecraft UUID 在时间窗口内允许的最大提交次数
      max: 8
    email:
      # 每个邮箱在时间窗口内允许的最大提交次数
      max: 6

# ----------------------------------------
# LLM 问答评分（用于 text 问题）
# ----------------------------------------
llm:
  # 是否启用 LLM 自动评分。关闭后 text 题将全部转人工审核
  enabled: true
  # 评分提供方。可选：deepseek / google
  provider: deepseek
  # OpenAI 兼容接口基础地址，必须使用 https（程序会自动拼接 /chat/completions；ensureHttpsApiBase() 会拒绝 http://，包括内网本地代理地址）
  api_base: https://api.deepseek.com/v1
  # API 密钥
  api_key: ""
  # 模型名称
  model: deepseek-chat
  # 请求超时时间（毫秒）
  timeout: 10000
  # 解析失败或网络失败时的重试次数
  retry: 1
  # LLM 并发请求上限（用于保护接口和服务器负载）
  max_concurrency: 4
  # 获取并发配额的最长等待时间（毫秒）
  acquire_timeout: 1500
  # 重试退避基础时长（毫秒）
  retry_backoff_base: 300
  # 重试退避最大时长（毫秒）
  retry_backoff_max: 5000
  # 发送给模型的输入最大长度（字符）
  input_max_length: 2000
  circuit_breaker:
    # 熔断触发阈值（连续失败次数）
    failure_threshold: 5
    # 熔断开启时长（毫秒）
    open_ms: 30000
  # 固定系统提示词（和题目、回答、评分规则一起拼装）
  system_prompt: |
    你是一个公平的 Minecraft 白名单问卷评分助手。
    你必须严格根据题目、用户回答和评分规则进行打分。
    返回 JSON，且仅返回 JSON。
  # 评分规则文本，会拼接到用户提示词（可在 questionnaire.yml 的 text 题上用 scoring_rule 覆盖）
  scoring_rule: |
    主要考察：
    1) 与题意相关性
    2) 回答完整度与细节
    3) 对服务器规则与社区氛围的理解
  # 期望模型输出格式（JSON）
  score_format: '{"score": number, "reason": string, "confidence": number}'

# ----------------------------------------
# Discord集成（OAuth2）
# ----------------------------------------
# 需要在 https://discord.com/developers/applications 创建 Discord 应用
discord:
  # 是否启用 Discord 集成
  enabled: false
  # Discord 应用的客户端ID
  client_id: ""
  # Discord 应用的客户端密钥
  client_secret: ""
  # OAuth2 回调地址
  redirect_uri: "https://yourdomain.com/api/discord/callback"
  # 可选：要求用户加入特定服务器的ID
  guild_id: ""
  # 是否强制要求绑定 Discord 才能注册
  required: false

# ----------------------------------------
# 下载资源配置
# ----------------------------------------
# 配置服务器客户端资源下载项，显示在网页界面的下载页面
downloads:
  # 示例：
  # client-modpack:
  #   # 下载项名称
  #   name: "Client Modpack"
  #   # 下载项描述
  #   description: "Required modpack for the server. Includes all necessary mods and configurations."
  #   # 版本号
  #   version: "1.0.0"
  #   # 文件大小（显示用）
  #   size: "256 MB"
  #   # 下载链接
  #   url: "https://example.com/modpack.zip"
  #   # 图标名称（可选：gamepad, package, download, file, folder 等）
  #   icon: "gamepad"
